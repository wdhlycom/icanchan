name: Scheduled Publish

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）触发一次
    - cron: "0 0 * * *"
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点按钮立即触发测试

jobs:
  trigger-vercel-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.Scedule }}"
          echo "Triggered Vercel deployment."