baseURL = 'https://chan.surf'
languageCode = 'en-us'
title = 'East Chan Mind'
theme = 'hugo-papermod-master'

[params]
  env = 'production'
  description = 'Chan is the Chinese root of Zen. We surf the source, not the wave.'
  author = 'Hu'
  defaultTheme = 'dark'
  disableThemeToggle = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowShareButtons = true
  ShowPageNums = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  
  [params.homeInfoParams]
    Title = 'East Chan Mind'
    Content = 'Chan is the Chinese root of Zen. We surf the source, not the wave.'
    AlignSocialIconsTo = 'center'

  [params.label]
    text = 'East Chan Mind'
    icon = ''
    iconHeight = 30

  [params.footer]
    hideCopyright = false
    text = ''

[params.assets]
  disableHLJS = true

[menu]
  [[menu.main]]
    identifier = 'start-here'
    name = 'Start Here'
    url = '/start-here/'
    weight = 10
  
  [[menu.main]]
    identifier = 'series'
    name = 'Series'
    url = '/series/'
    weight = 20
  
  [[menu.main]]
    identifier = 'articles'
    name = 'Articles'
    url = '/articles/'
    weight = 30
  
  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 40
  
  [[menu.main]]
    identifier = 'subscribe'
    name = 'Subscribe'
    url = '/subscribe/'
    weight = 50

[languages]
  [languages.en]
    languageName = 'English'
    weight = 1
    
[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
  [markup.highlight]
    noClasses = false
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = 'monokai'
