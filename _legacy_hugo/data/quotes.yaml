quotes:
  - text: "Let the mind arise without fixing it anywhere."
    source: "The Diamond Sutra"
    chinese: "《金刚经》"
  - text: "Not thinking about good, not thinking about evil — right at this moment, what is your original face?"
    source: "Huineng, Sixth Patriarch"
    chinese: "惠能·六祖"
  - text: "When you sit, just sit. When you walk, just walk. Don't wobble."
    source: "Yunmen"
    chinese: "云门文偃"
  - text: "The ordinary mind is the Way."
    source: "Mazu Daoyi"
    chinese: "马祖道一"
  - text: "Before enlightenment, chop wood, carry water. After enlightenment, chop wood, carry water."
    source: "Chan Proverb"
    chinese: "禅宗谚语"
  - text: "If you meet the Buddha on the road, kill him."
    source: "Linji Yixuan"
    chinese: "临济义玄"
  - text: "A special transmission outside the scriptures, not founded upon words and letters."
    source: "Bodhidharma"
    chinese: "菩提达摩"
  - text: "Sitting quietly, doing nothing, spring comes, and the grass grows by itself."
    source: "Basho"
    chinese: "松尾芭蕉"
  - text: "The whole moon and the entire sky are reflected in dewdrops on the grass."
    source: "Dogen"
    chinese: "道元"
  - text: "Do not seek to follow in the footsteps of the wise. Seek what they sought."
    source: "Matsuo Basho"
    chinese: "松尾芭蕉"